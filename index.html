<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123b70">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <title>ACVTC-CI</title>
</head>

<body>

<header>
  <div>
    <b>ACVTC-CI</b>
    <small>Travail aujourd'hui pour le bonheur de demain.</small>
  </div>

  <button id="out" class="hide" onclick="logout()">
    Déconnexion
  </button>
</header>

<main>

  <section id="login" class="card login">

    <h1>Connexion ACVTC-CI</h1>

    <label>Adresse e-mail</label>
    <input
      id="user"
      type="email"
      placeholder="Votre adresse e-mail"
      autocomplete="email"
    >

    <label>Mot de passe</label>
    <input
      id="pass"
      type="password"
      placeholder="Votre mot de passe"
      autocomplete="current-password"
    >

    <button onclick="login()">
      Se connecter
    </button>

    <p id="login-message" class="note"></p>

  </section>

  <section id="app" class="hide">
    <nav id="nav"></nav>
    <div id="content"></div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app.js"></script>

</body>
</html>
